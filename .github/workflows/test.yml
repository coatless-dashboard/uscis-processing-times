# .github/workflows/test.yml
name: Test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::DBI
            any::digest
            any::RSQLite
            any::arrow
            any::jsonlite
            any::curl
            any::gh
            any::testthat
            any::withr
      - name: Run unit tests
        env:
          # the suite never reaches the network, so a placeholder satisfies the
          # config guard without carrying the real name into the repository
          SOURCE_RELEASES_REPO: placeholder/placeholder
        run: Rscript tests/testthat.R
