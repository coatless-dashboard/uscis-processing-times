# .github/workflows/update.yml
name: Update
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: "Rebuild every derived table from the full panel."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: processing-times-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::DBI
            any::digest
            any::RSQLite
            any::arrow
            any::jsonlite
            any::curl
            any::gh
            any::testthat
            any::withr
      - name: Run unit tests
        env:
          SOURCE_RELEASES_REPO: placeholder/placeholder
        run: Rscript tests/testthat.R
      - name: Fetch prior artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RELEASES_REPO: ${{ secrets.SOURCE_RELEASES_REPO }}
        run: |
          set -euo pipefail
          mkdir -p state out
          gh release download current --pattern "manifest.json" --dir state || true
          gh release download current --pattern "processing-times.db" --dir state || true
      - name: Run update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RELEASES_REPO: ${{ secrets.SOURCE_RELEASES_REPO }}
          FORCE_FULL_REBUILD: ${{ github.event.inputs.force_full_rebuild }}
        run: |
          Rscript -e '
            for (f in c("config.R","normalize.R","extract.R","fetch.R","panel.R",
                        "derive.R","manifest.R","artifacts.R","checks.R",
                        "backfill.R","update.R")) source(file.path("scripts", f));
            assets <- list_release_assets();
            force_full_rebuild <- identical(tolower(Sys.getenv("FORCE_FULL_REBUILD")), "true");
            res <- run_update("state", assets, "out", force_full_rebuild = force_full_rebuild);
            print(res);
            for (w in res$warnings) message("WARNING: ", w)'
      - name: Publish artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no artifacts to publish (no-change run)"
          else
            if ! gh release view current >/dev/null 2>&1; then
              git tag -f current
              git push -f origin current || true
              gh release create current --title "current" --notes "Rolling panel."
            fi
            gh release upload current "${files[@]}" --clobber
          fi
      - name: Record run time
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last-updated.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-updated.txt
          git diff --staged --quiet || git commit -m "update last run time"
          git push
