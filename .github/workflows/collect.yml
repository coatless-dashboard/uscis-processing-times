# .github/workflows/collect.yml
#
# Fills the archive backwards a chunk at a time.
#
# The releases endpoint stops at 1000 rows, so the oldest part of the archive
# cannot be listed at all. Tags can be listed however deep it goes, and a
# release can be fetched directly by tag, so collection walks the tag list
# instead. Each run takes the oldest tags not yet held, adds them to the panel
# and republishes, then queues the next run if anything is still missing.
name: Collect

on:
  workflow_dispatch:
    inputs:
      chunk_size:
        description: "Snapshots to collect in this run."
        type: number
        default: 100
      continue:
        description: "Queue the next chunk automatically until the archive is complete."
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: processing-times-update   # never runs alongside Update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::DBI
            any::RSQLite
            any::digest
            any::arrow
            any::jsonlite
            any::curl
            any::gh

      - name: Fetch prior artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p state out
          gh release download current --pattern manifest.json --dir state || true
          gh release download current --pattern processing-times.db --dir state || true
          ls -lh state/ || true

      - name: Collect a chunk
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RELEASES_REPO: ${{ secrets.SOURCE_RELEASES_REPO }}
          CHUNK_SIZE: ${{ inputs.chunk_size }}
        run: |
          Rscript -e '
            for (f in c("config.R","normalize.R","extract.R","fetch.R","panel.R",
                        "derive.R","manifest.R","artifacts.R","checks.R",
                        "backfill.R","update.R")) source(file.path("scripts", f));

            n <- as.integer(Sys.getenv("CHUNK_SIZE", "100"));
            prev <- if (file.exists("state/manifest.json"))
                      jsonlite::read_json("state/manifest.json", simplifyVector = FALSE)
                    else list(snapshots = list());

            all_tags <- list_all_tags();
            todo <- pending_tags(all_tags, prev, n);
            message("archive tags: ", length(all_tags),
                    " | already held: ", length(prev$snapshots),
                    " | this chunk: ", length(todo));

            if (length(todo) == 0) {
              writeLines("remaining=0", Sys.getenv("GITHUB_OUTPUT"));
              message("archive complete");
              quit(save = "no", status = 0)
            }

            assets <- assets_for_tags(todo);
            res <- run_backfill_chunk("state", assets, "out");
            print(res);
            for (w in res$warnings) message("WARNING: ", w);

            remaining <- length(setdiff(all_tags, union(names(prev$snapshots), todo)));
            writeLines(paste0("remaining=", remaining), Sys.getenv("GITHUB_OUTPUT"));
            message("remaining after this run: ", remaining)'

      - name: Publish artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "nothing collected this run"
          else
            if ! gh release view current >/dev/null 2>&1; then
              gh release create current --title current --notes "Rolling panel." --target "$GITHUB_SHA"
            fi
            gh release upload current "${files[@]}" --clobber
          fi

      # Queue the next chunk rather than looping inside one job, so each chunk
      # is a separate run with its own log and the walk can be stopped by
      # simply not queueing again.
      - name: Queue the next chunk
        if: inputs.continue && steps.collect.outputs.remaining != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::notice title=Continuing::${{ steps.collect.outputs.remaining }} snapshots still to collect; queueing the next chunk."
          gh workflow run Collect \
            --ref "${GITHUB_REF_NAME}" \
            -f chunk_size="${{ inputs.chunk_size }}" \
            -f continue=true
