# .github/workflows/collect.yml
#
# Fills the archive backwards a chunk at a time.
#
# The releases endpoint stops at 1000 rows, so the oldest part of the archive
# cannot be listed at all. Tags can be listed however deep it goes, and a
# release can be fetched directly by tag, so collection walks the tag list
# instead. One run walks as many chunks as its time budget allows, then
# publishes once. Re-run it until it reports nothing remaining.
name: Collect

on:
  workflow_dispatch:
    inputs:
      chunk_size:
        description: "Snapshots per chunk. Each chunk rebuilds the derived tables, so fewer, larger chunks finish sooner."
        type: number
        default: 250
      budget_minutes:
        description: "Stop starting new chunks after this many minutes."
        type: number
        default: 90

permissions:
  contents: write

concurrency:
  group: processing-times-update   # never runs alongside Update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::DBI
            any::RSQLite
            any::digest
            any::arrow
            any::jsonlite
            any::curl
            any::gh

      - name: Fetch prior artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p state out
          gh release download current --pattern manifest.json --dir state || true
          gh release download current --pattern processing-times.db --dir state || true
          ls -lh state/ || true

      - name: Collect a chunk
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RELEASES_REPO: ${{ secrets.SOURCE_RELEASES_REPO }}
          CHUNK_SIZE: ${{ inputs.chunk_size }}
          BUDGET_MINUTES: ${{ inputs.budget_minutes }}
        run: Rscript tools/collect.R

      - name: Publish artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "nothing collected this run"
          else
            if ! gh release view current >/dev/null 2>&1; then
              gh release create current --title current --notes "Rolling panel." --target "$GITHUB_SHA"
            fi
            gh release upload current "${files[@]}" --clobber
          fi

      - name: Report
        run: |
          echo "::notice title=Collect::${{ steps.collect.outputs.collected }} collected, ${{ steps.collect.outputs.remaining }} remaining. Re-run this workflow to continue."
